<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Profile Card</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Interactive Profile Card</h1>
            <button id="toggle-tema" type="button">Ganti Tema</button>
        </header>
        
        <p id="status" role="status" aria-live="polite" data-state="idle">Belum ada proses.</p>
        <button id="muat-data" type="button">Muat Profil</button>
        <button id="coba-lagi" type="button" hidden>Coba Lagi</button>
        
        <main id="profil-container" hidden>
            <div class="card">
                <h2 id="profil-nama">Nama</h2>
                
                <button id="toggle-detail" type="button" aria-expanded="false" class="mt-2">Lihat Detail</button>
                <div id="profil-detail" hidden>
                    <p id="profil-bio">Bio</p>
                </div>
                
                <hr>
                
                <h3>Keterampilan</h3>
                <form id="form-keterampilan" novalidate>
                    <label for="input-keterampilan">Tambah Keterampilan</label>
                    <input type="text" id="input-keterampilan" name="keterampilan" autocomplete="off" required>
                    <small id="error-keterampilan" class="error"></small>
                    <button type="submit">Tambah</button>
                </form>
                
                <ul id="daftar-keterampilan" class="list-keterampilan"></ul>
            </div>
        </main>
    </div>
    
    <script src="js/app.js" defer></script>
</body>
</html>
